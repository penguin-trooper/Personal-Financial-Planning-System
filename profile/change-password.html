<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="custom-container">
    <div class="card">
      <h2 style="color: #EDF6BD;">Change Password</h2>
      <div class="user-box">
        <label>New Password</label>
        <input type="password" id="new-password">
        <label>Confirm Password</label>
        <input type="password" id="confirm-password">
        <div class="buttons">
          <button id="save-password">Save</button>
          <button id="cancel-password">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const savePasswordBtn = document.getElementById('save-password');
    const cancelPasswordBtn = document.getElementById('cancel-password');

    savePasswordBtn.addEventListener('click', async () => {
      const newPass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      // 1. Basic Frontend Validations
      if (!newPass || newPass.length < 6) {
        alert('Password must be at least 6 characters.');
        return;
      }
      if (newPass !== confirmPass) {
        alert('Passwords do not match.');
        return;
      }

      // 2. Database API Call
      try {
        const response = await fetch('/api/profile/change-password', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentPassword: "", // Since your HTML doesn't have a "current password" input, we send blank or pass validation on server if required
            newPassword: newPass,
            confirmPassword: confirmPass
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert('Password updated in database successfully!');
          window.location.href = "profile.html"; // go back to main page
        } else {
          // If the backend strength validation fails (e.g. requires upper case or symbol)
          alert('Error: ' + (result.error || 'Failed to update password.'));
        }
      } catch (error) {
        console.error('Password API error:', error);
        alert('Could not reach the server.');
      }
    });

    cancelPasswordBtn.addEventListener('click', () => {
      window.location.href = "profile.html"; // go back without saving
    });
  </script>
</body>
</html>
