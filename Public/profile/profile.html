<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Alegreya+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
    <title>Moneta - Profile Settings</title>
    <link rel="stylesheet" href="../css/profile.css">

    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 4px;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 40px !important; 
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-35%);
            background: none !important;
            border: none !important;
            color: #777777 !important;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #000000 !important;
        }

        .field-alert {
            font-size: 12px;
            color: #e07a5f;
            margin-top: 4px;
            margin-bottom: 12px;
            text-align: left;
            min-height: 18px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg moneta-navbar sticky-top" id="mainNavbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="../home-page.html">Moneta</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-center" id="navbarContent">
                <ul class="navbar-nav gap-1">
                    <li class="nav-item"><a class="nav-link" href="../home-page.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="../Financial_planner.html">Financial Planner</a></li>
                    <li class="nav-item"><a class="nav-link" href="../roi-calculator.html">ROI Calculator</a></li>
                    <li class="nav-item"><a class="nav-link" href="../market-insight.html">Market Insights</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center gap-2">
                <span class="nav-username d-none d-lg-inline">User Name</span>
                <div class="dropdown">
                    <button class="nav-avatar-btn" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-fill"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end moneta-dropdown-menu" aria-labelledby="profileDropdown">
                        <li><a class="dropdown-item" href="profile.html"><i class="bi bi-gear"></i> Settings</a></li>
                        <li><hr class="dropdown-divider" style="border-color:rgba(255,255,255,0.15);"></li>
                        <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right"></i> Log Out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="custom-container">
        <div class="card" id="user-setting">
            <h2>User Setting</h2>
            <div class="user-box">
                <label>Username</label>
                <input type="text" value="JohnDoe" disabled>
                <label>Email</label>
                <input type="email" value="john@example.com" disabled>
                <div class="buttons">
                    <button class="edit">Edit</button>
                    <button class="delete">Delete</button>
                </div>
            </div>
        </div>

        <div class="card" id="edit-user" style="display:none;">
            <h2>Edit User</h2>
            <div class="user-box">
                <label>Username</label>
                <input type="text" id="edit-username" value="JohnDoe">
                <label>Email</label>
                <input type="email" id="edit-email" value="john@example.com">

                <div class="buttons" style="justify-content: center;">
                    <button class="yellow" id="change-password">Change Password</button>
                </div>

                <div class="buttons">
                    <button class="save">Save</button>
                    <button class="cancel">Cancel</button>
                </div>
            </div>
        </div>

        <div class="card" id="password-container" style="display:none;">
            <h2>Change Password</h2>
            <div class="user-box">
                <label for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="Enter new strong password">
                    <button type="button" class="toggle-password" onclick="toggleFieldVisibility('newPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div id="passwordAlert" class="field-alert"></div>

                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm your new password">
                    <button type="button" class="toggle-password" onclick="toggleFieldVisibility('confirmPassword', this)">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <div class="buttons mt-4">
                    <button class="save" id="save-password-btn">Update</button>
                    <button class="cancel" id="cancel-password-btn">Back</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Password visibility toggle handler (Show/Hide text)
        function toggleFieldVisibility(inputId, buttonEl) {
            const field = document.getElementById(inputId);
            const icon = buttonEl.querySelector('i');
            if (field.type === "password") {
                field.type = "text";
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                field.type = "password";
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        // Real-time security criteria parsing listener
        document.getElementById('newPassword').addEventListener('input', function() {
            const value = this.value;
            const alertBox = document.getElementById('passwordAlert');
            
            // Matches backend validation setup: Min 8 chars with Uppercase, Lowercase, and Special Character
            const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;
            
            if (value.length === 0) {
                alertBox.innerHTML = "";
            } else if (!strongPasswordRegex.test(value)) {
                alertBox.innerHTML = `<i class="bi bi-shield-exclamation"></i> Min 8 characters with uppercase, lowercase, & symbols.`;
                alertBox.style.color = "#e07a5f";
            } else {
                alertBox.innerHTML = `<i class="bi bi-shield-check"></i> Formatted securely.`;
                alertBox.style.color = "#28a745";
            }
        });
    </script>

    <script src="../js/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
