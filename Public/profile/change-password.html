<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneta - Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
        
        <div class="card bootstrap-profile-card p-4 p-sm-5 text-center border-0 w-100">
            <h2 class="profile-card-title mb-1">Change Password</h2>
            <p class="text-secondary small mb-4">Ensure passwords match systemic security rules.</p>

            <div class="user-box text-start">
                <div class="mb-2">
                    <label class="form-label small fw-bold text-uppercase tracking-wider text-moneta-yellow" for="new-password">New Password</label>
                    <div class="input-group position-relative">
                        <input type="password" id="new-password" class="form-control bg-white text-dark border-secondary-subtle py-2 ps-3 pe-5" placeholder="Enter new password">
                        <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y border-0 text-secondary z-3" onclick="toggleFieldVisibility('new-password', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div id="passwordAlert" class="small fw-semibold mt-2 d-flex align-items-center gap-1 min-h-20"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-uppercase tracking-wider text-moneta-yellow" for="confirm-password">Confirm Password</label>
                    <div class="input-group position-relative">
                        <input type="password" id="confirm-password" class="form-control bg-white text-dark border-secondary-subtle py-2 ps-3 pe-5" placeholder="Confirm your password">
                        <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y border-0 text-secondary z-3" onclick="toggleFieldVisibility('confirm-password', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 pt-3 border-top border-light-subtle mt-4">
                    <button class="btn btn-outline-moneta py-2 px-4 fw-bold" id="cancel-password">Cancel</button>
                    <button class="btn btn-moneta py-2 px-4 fw-bold" id="save-password">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Eye-Tracking Toggle Logic 
        function toggleFieldVisibility(inputId, buttonEl) {
            const field = document.getElementById(inputId);
            const icon = buttonEl.querySelector('i');
            
            if (field.type === "password") {
                // If hidden then reveal characters and update icon to slashed eye
                field.type = "text";
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                // If currently revealed, mask characters and update icon to normal eye
                field.type = "password";
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

      
        document.getElementById('new-password').addEventListener('input', function() {
            const value = this.value;
            const alertBox = document.getElementById('passwordAlert');
            const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;
            
            if (value.length === 0) {
                alertBox.innerHTML = "";
            } else if (!strongPasswordRegex.test(value)) {
                alertBox.innerHTML = `<i class="bi bi-shield-exclamation text-danger"></i> <span class="text-danger">Min 8 characters with uppercase, lowercase, & symbols.</span>`;
            } else {
                alertBox.innerHTML = `<i class="bi bi-shield-check text-success"></i> <span class="text-success">Formatted securely.</span>`;
            }
        });

        
        const savePasswordBtn = document.getElementById('save-password');
        const cancelPasswordBtn = document.getElementById('cancel-password');

        savePasswordBtn.addEventListener('click', () => {
            const newPass = document.getElementById('new-password').value;
            const confirmPass = document.getElementById('confirm-password').value;
            const strongPasswordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;

            if (!newPass || !strongPasswordRegex.test(newPass)) {
                alert('Password does not meet safety instructions criteria requirements.');
                return;
            }
            if (newPass !== confirmPass) {
                alert('Passwords do not match.');
                return;
            }

            alert('Password updated successfully!');
            window.location.href = "profile.html"; 
        });

        cancelPasswordBtn.addEventListener('click', () => {
            window.location.href = "profile.html"; 
        });
    </script>
</body>

</html>
